services:
  - type: web
    name: celehs-data
    runtime: python
    plan: free
    buildCommand: pip install -r local_demo/requirements.txt
    startCommand: uvicorn local_demo.app:app --host 0.0.0.0 --port $PORT --workers 1 --no-access-log
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: CATALOG_PROVIDER
        value: cloudflare
      - key: CATALOG_CHAT_ENABLED
        value: "false"
      - key: CATALOG_CLOUD_LIMITS_CONFIRMED
        value: "false"
      - key: CLOUDFLARE_GATEWAY_ID
        value: celehs-data
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
